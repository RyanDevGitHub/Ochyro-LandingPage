server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html/public;
    index index.php;

    # Compression gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/html
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    # Security headers (bonus SEO technique)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri /index.php?$query_string;
        # Cache HTML pages : revalidation côté navigateur
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # Cache long terme pour les assets statiques (CSS, JS, fonts, images)
    location ~* \.(css|js|woff2|woff|ttf|otf|ico|svg|png|jpg|jpeg|webp|gif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~ \.php$ {
        include fastcgi_params;
        # ICI : On pointe vers l'autre container par son NOM
        fastcgi_pass aura-web:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public$fastcgi_script_name;
    }
}
